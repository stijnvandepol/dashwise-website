services:
  web:
    build: .
    image: dashwise-website:latest
    container_name: dashwise-website
    restart: unless-stopped
    # Only on localhost: a reverse proxy on the host (Caddy, Traefik, nginx) terminates TLS for getdashwise.nl.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
