name: dashwise-website

services:
  web:
    build: .
    image: dashwise-website:latest
    container_name: dashwise-website
    restart: unless-stopped
    # Reachable from outside the host, so the existing Cloudflare Tunnel (cloudflared elsewhere on the
    # network) can reach it. Set WEB_BIND=127.0.0.1 to keep it local to the server.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
