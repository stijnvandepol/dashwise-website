server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css text/plain application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # Clean URLs: /support serves support.html, /support.html redirects to /support.
    # Only plain page names, so the Location header can never point at another host (//evil.example).
    location ~ "^/(?<page>[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*)\.html$" {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$page$is_args$args;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:png|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /assets/style.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
