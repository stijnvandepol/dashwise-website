# Access log without client IP addresses and user agents: the site processes no IP addresses in its logs.
log_format noip '[$time_iso8601] "$request" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    # Logs go to stdout/stderr (Docker log driver). Client addresses stay out of the access log;
    # the error log would name the client on every missing file, so only critical errors are kept.
    access_log /dev/stdout noip;
    error_log /dev/stderr crit;

    gzip on;
    gzip_types text/css text/plain application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # Clean URLs: /support serves support.html, and a request for /support.html redirects to /support.
    # The redirect looks at what the visitor asked for ($request_uri), not at nginx's internal
    # rewrites, so "/" serving index.html never bounces to "/index". Only plain page names match, so
    # the Location header can never point at another host (//evil.example).
    location ~ \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        if ($request_uri ~ "^/((?:[A-Za-z0-9_-]+/)*)index\.html(?:\?.*)?$") { return 301 /$1; }
        if ($request_uri ~ "^/([A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*)\.html(\?.*)?$") { return 301 /$1$2; }
        try_files $uri =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:png|jpg|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # The pages link style.css?v=<commit>, so a new deploy always loads the new styles.
    location = /assets/style.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
